<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Persona — ADHD Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      transition: all 0.3s ease;
    }
    body {
      margin: 0;
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #ffdee9 0%, #b5fffc 100%);
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* ---------- Sidebar ---------- */
    .sidebar {
      width: 260px;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(20px);
      padding: 20px;
      box-shadow: 4px 0 15px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .sidebar h2 {
      margin: 0 0 15px 0;
      font-size: 1.4em;
      text-align: center;
      color: #1d1d1f;
    }

    .history-section {
      margin-bottom: 25px;
    }

    .history-section h3 {
      font-size: 1.1em;
      color: #007aff;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .history-item {
      background: rgba(255, 255, 255, 0.8);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 10px;
      font-size: 0.9em;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(8px);}
      to {opacity: 1; transform: translateY(0);}
    }

    /* ---------- Main Area ---------- */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 30px;
      overflow: hidden;
    }

    /* ---------- Tabs ---------- */
    .tabs {
      display: flex;
      gap: 30px;
      margin-bottom: 30px;
    }

    .tabs button {
      background: linear-gradient(135deg, #ffd1ff, #c4f0ff);
      border: none;
      border-radius: 16px;
      padding: 20px 25px;
      font-size: 1em;
      font-weight: 600;
      color: #1d1d1f;
      cursor: pointer;
      box-shadow: 0 6px 12px rgba(0,0,0,0.1);
    }
    .tabs button:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 16px rgba(0,0,0,0.15);
    }

    /* ---------- Card ---------- */
    .card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(25px);
      border-radius: 20px;
      padding: 30px;
      width: 80%;
      max-width: 700px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }

    textarea, input {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #ccc;
      background: rgba(255, 255, 255, 0.9);
      font-size: 1em;
      margin-top: 10px;
      outline: none;
    }

    textarea:focus, input:focus {
      border-color: #007aff;
      box-shadow: 0 0 0 3px rgba(0,122,255,0.2);
    }

    button.action {
      background: linear-gradient(135deg, #ff8a00, #da1b60);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 10px 18px;
      margin-top: 15px;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(255, 140, 0, 0.4);
    }

    button.action:hover {
      transform: translateY(-3px);
    }

    .output {
      background: rgba(255, 255, 255, 0.8);
      border-radius: 12px;
      padding: 12px;
      margin-top: 20px;
      text-align: left;
      max-height: 250px;
      overflow-y: auto;
      white-space: pre-wrap;
      font-family: "SF Mono", monospace;
      color: #1d1d1f;
    }

    .xp-ring {
      position: relative;
      width: 150px;
      height: 150px;
      margin: 0 auto 20px auto;
    }

    .xp-svg {
      transform: rotate(-90deg);
      width: 150px;
      height: 150px;
    }

    .xp-bg {
      fill: none;
      stroke: #d3d3d3;
      stroke-width: 10;
      opacity: 0.3;
    }

    .xp-progress {
      fill: none;
      stroke: url(#xpGradient);
      stroke-width: 10;
      stroke-linecap: round;
      stroke-dasharray: 314;
      stroke-dashoffset: 314;
      transition: stroke-dashoffset 1.2s ease-in-out;
    }

    .xp-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    #xpDisplay {
      font-size: 2.2em;
      font-weight: 600;
      color: #1d1d1f;
    }

    .gmail-btn {
      margin-top: 15px;
      background: linear-gradient(135deg, #4285f4, #34a853, #fbbc05, #ea4335);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      background-size: 300%;
      animation: gradientMove 4s infinite linear;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

  </style>
</head>
<body>

  <!-- Left Sidebar -->
  <div class="sidebar">
    <h2>🧠 Persona History</h2>
    <div id="history">
      <div class="history-section">
        <h3>Chats</h3>
        <div id="chatHistory"></div>
      </div>
      <div class="history-section">
        <h3>Tasks</h3>
        <div id="taskHistory"></div>
      </div>
    </div>
  </div>

  <!-- Main Section -->
  <div class="main">
    <div class="tabs">
      <button onclick="show('chat')">💬 Chat</button>
      <button onclick="show('tasks')">📝 Tasks</button>
      <button onclick="show('xp')">⭐ XP Tracker</button>
      <button onclick="show('email')">📧 Email</button>
    </div>

    <div id="contentArea" class="card"></div>
  </div>

  <!-- XP Gradient -->
  <svg width="0" height="0">
    <defs>
      <linearGradient id="xpGradient" x1="1" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ff0080" />
        <stop offset="100%" stop-color="#7928ca" />
      </linearGradient>
    </defs>
  </svg>

  <script>
    const BASE = "https://persona-backend-4ru3.onrender.com";
    const content = document.getElementById("contentArea");

    async function show(view) {
      if (view === "chat") content.innerHTML = `
        <h1>Chat with Persona</h1>
        <textarea id="chatInput" placeholder="Ask anything..."></textarea>
        <button class="action" onclick="sendChat()">Send</button>
        <div id="chatOutput" class="output">Waiting for message...</div>
      `;
      else if (view === "tasks") content.innerHTML = `
        <h1>Task Planner</h1>
        <textarea id="taskInput" placeholder="What do you want to plan?"></textarea>
        <button class="action" onclick="makeTasks()">Generate</button>
        <div id="taskOutput" class="output">Waiting...</div>
      `;
      else if (view === "xp") content.innerHTML = `
        <h1>XP Tracker</h1>
        <div class="xp-ring">
          <svg class="xp-svg" viewBox="0 0 120 120">
            <circle class="xp-bg" cx="60" cy="60" r="50"></circle>
            <circle class="xp-progress" cx="60" cy="60" r="50"></circle>
          </svg>
          <div class="xp-text">
            <div id="xpDisplay">0</div><small>XP</small>
          </div>
        </div>
        <input id="xpAction" placeholder="Action (chat, task, email)" />
        <button class="action" onclick="addXP()">Add XP</button>
      `;
      else if (view === "email") content.innerHTML = `
        <h1>Email Composer</h1>
        <textarea id="emailInput" placeholder="Paste thread or draft..."></textarea>
        <button class="action" onclick="composeEmail()">Generate Draft</button>
        <div id="emailOutput" class="output">Waiting...</div>
        <button class="gmail-btn" onclick="openGmail()">Open Gmail Compose</button>
      `;
      fetchHealth();
    }

    async function sendChat() {
      const message = document.getElementById("chatInput").value;
      const output = document.getElementById("chatOutput");
      output.textContent = "Thinking...";
      const res = await fetch(`${BASE}/ask`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message })
      });
      const data = await res.json();
      output.textContent = data.reply;
      loadHistory();
    }

    async function makeTasks() {
      const goal = document.getElementById("taskInput").value;
      const out = document.getElementById("taskOutput");
      out.textContent = "Planning...";
      const res = await fetch(`${BASE}/tasks`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ goal })
      });
      const data = await res.json();
      out.textContent = data.tasks;
      loadHistory();
    }

    async function composeEmail() {
      const thread = document.getElementById("emailInput").value;
      const output = document.getElementById("emailOutput");
      output.textContent = "Composing...";
      const res = await fetch(`${BASE}/draft-email`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ thread })
      });
      const data = await res.json();
      output.textContent = data.draft;
      loadHistory();
    }

    function openGmail() {
      window.open("https://mail.google.com/mail/u/0/#inbox?compose=new", "_blank");
    }

    async function addXP() {
      const action = document.getElementById("xpAction").value || "chat";
      const res = await fetch(`${BASE}/xp`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action })
      });
      const data = await res.json();
      animateXP(data.total_xp);
    }

    function animateXP(xp) {
      const circle = document.querySelector('.xp-progress');
      if (!circle) return;
      const maxXP = 1000;
      const offset = 314 - (xp / maxXP) * 314;
      circle.style.strokeDashoffset = offset;
      document.getElementById("xpDisplay").textContent = xp;
    }

    async function fetchHealth() {
      const res = await fetch(`${BASE}/health`);
      const data = await res.json();
      animateXP(data.xp);
    }

    async function loadHistory() {
      const res = await fetch(`${BASE}/history`);
      const data = await res.json();

      const chatDiv = document.getElementById("chatHistory");
      chatDiv.innerHTML = data.chats.map(c =>
        `<div class="history-item"><b>You:</b> ${c.user}<br><b>AI:</b> ${c.ai}</div>`
      ).join("");

      const taskDiv = document.getElementById("taskHistory");
      taskDiv.innerHTML = data.tasks.map(t =>
        `<div class="history-item"><b>Goal:</b> ${t.goal}<br>${t.items}</div>`
      ).join("");
    }

    // Load defaults
    show("chat");
    loadHistory();
  </script>
</body>
</html>
